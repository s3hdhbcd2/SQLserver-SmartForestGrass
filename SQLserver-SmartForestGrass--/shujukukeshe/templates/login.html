{% extends 'base.html' %}

{% block content %}
    <div class="login-container">
        <div class="login-card">
            <h2>智能森林草原监测预警系统</h2>
            
            <!-- 登录/注册切换 -->
            <div class="tab-container">
                <button class="tab-btn active" onclick="switchTab('login')">登录</button>
                <button class="tab-btn" onclick="switchTab('register')">注册</button>
            </div>
            
            <!-- 错误信息显示 -->
            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}
            {% if success %}
                <div class="success-message">{{ success }}</div>
            {% endif %}
            
            <!-- 登录表单 -->
            <form id="login-form" method="POST" action="/login" style="display: block;">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required placeholder="请输入密码">
                </div>
                <div style="margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">登录</button>
                </div>
            </form>
            
            <!-- 注册表单 -->
            <form id="register-form" method="POST" action="/register" style="display: none;">
                <div class="form-group">
                    <label for="reg-username">用户名</label>
                    <input type="text" id="reg-username" name="username" required placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="reg-password">密码</label>
                    <input type="password" id="reg-password" name="password" required placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <label for="reg-name">姓名</label>
                    <input type="text" id="reg-name" name="name" required placeholder="请输入姓名">
                </div>
                <div class="form-group">
                    <label for="reg-contact">联系方式</label>
                    <input type="text" id="reg-contact" name="contact" required placeholder="请输入联系方式">
                </div>
                <div style="margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">注册</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        function switchTab(tabName) {
            // 切换标签样式
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // 切换表单显示
            if (tabName === 'login') {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('register-form').style.display = 'none';
            } else {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('register-form').style.display = 'block';
            }
        }
    </script>
    
    <style>
        .tab-container {
            display: flex;
            margin-bottom: 1rem;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .tab-btn {
            flex: 1;
            padding: 0.5rem;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: #666;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            border-bottom: 2px solid #1890ff;
            color: #1890ff;
            font-weight: bold;
        }
        
        .error-message {
            background-color: #fff2f0;
            color: #ff4d4f;
            padding: 0.5rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }
        
        .success-message {
            background-color: #f6ffed;
            color: #52c41a;
            padding: 0.5rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }
    </style>
{% endblock %}
